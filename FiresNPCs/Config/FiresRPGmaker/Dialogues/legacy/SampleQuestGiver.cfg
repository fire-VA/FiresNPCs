# ???????????????????????????????????????????????????????????????
# Sample Quest Giver — Condition-gated branching with quest flow
# Demonstrates: quest conditions, OR groups, AlwaysVisible,
#   OverrideError, RandomCommands, GiveBuff, skill checks, !negate
# ???????????????????????????????????????????????????????????????

[questgiver_greeting]
Hail, traveler. I am the Keeper of the Eastern Watch.\nOnly those who prove their worth may pass.
Text: I seek passage to the East | Transition: questgiver_passage | Icon: TrophyDeer
Text: I've come to offer tribute | Transition: questgiver_tribute | Condition: HasItem,TrophyDeer,1 | AlwaysVisible: true | OverrideError: Bring me a trophy first.
Text: What can you tell me about this place? | Transition: questgiver_info
Text: Farewell, Keeper | Color: 150,150,150

[questgiver_passage]
The eastern gate is sealed by ancient wards.\nTo open it you must complete the Trial of the Forest.
Text: I'll do it — give me the trial | Command: GiveQuest,trial_of_forest | Condition: NotHasQuest,trial_of_forest | Condition: QuestNotFinished,trial_of_forest | Transition: questgiver_trial_accepted | Color: 100,255,100
Text: I'm already on the trial | Condition: HasQuest,trial_of_forest | Transition: questgiver_trial_progress
Text: I've completed the trial! | Condition: QuestFinished,trial_of_forest | Transition: questgiver_trial_done | Color: 255,215,0
Text: I need to prepare first | Transition: questgiver_greeting | Color: 180,180,180

[questgiver_trial_accepted]
Brave soul.\nVenture into the Black Forest and slay 5 Greydwarves. Return when the deed is done.
@interaction Command: AddPlayerKey,trial_started
Text: I shall return victorious!

[questgiver_trial_progress]
The forest still awaits, %playername%.\nFinish what you started.
Text: I'm working on it | Condition: QuestProgressNotDone,trial_of_forest
Text: I believe I've finished | Condition: QuestProgressDone,trial_of_forest | Command: FinishQuest,trial_of_forest | Transition: questgiver_trial_done | Color: 100,255,100

[questgiver_trial_done]
You have proven yourself, %playername%!\nThe eastern gate is now open to you.
@interaction Command: AddPlayerKey,eastern_gate_unlocked
@interaction Command: GiveBuff,Rested,600
Text: Receive your reward | Command: GiveItem,Coins,200,1 | Command: GiveItem,ArrowFlint,50,1 | Transition: questgiver_greeting | Icon: Coins | Color: 255,215,0

[questgiver_tribute]
A deer trophy — fine craftsmanship.\nI accept your tribute.
@interaction Command: RemoveItem,TrophyDeer,1
@interaction RandomCommand: 50,GiveItem,Coins,50,1
@interaction RandomCommand: 30,GiveItem,Ruby,1,1
Text: Thank you, Keeper | Command: AddPlayerKey,keeper_tribute_paid | Transition: questgiver_greeting

[questgiver_info]
This watch has stood for a hundred winters.\nOnly the skilled may pass.
Text: How skilled must I be? | Transition: questgiver_skillcheck
Text: I've heard enough | Transition: questgiver_greeting | Color: 180,180,180

[questgiver_skillcheck]
You must have at least level 15 in Swords or Axes to be worthy.\nOr possess a special key of passage.
Text: Test my Swords skill | Condition: SkillMore,Swords,15 | Command: AddPlayerKey,swordmaster_verified | Transition: questgiver_skill_pass | Color: 100,255,100
Text: Test my Axes skill | Condition: SkillMore,Axes,15 | Command: AddPlayerKey,axemaster_verified | Transition: questgiver_skill_pass | Color: 100,255,100
Text: I have the key of passage | Condition: HasPlayerKey,eastern_gate_unlocked | Transition: questgiver_skill_pass | AlwaysVisible: true | OverrideError: You do not possess the key.
Text: I need more training... | Condition: !SkillMore,Swords,15 | Condition: !SkillMore,Axes,15 | AlwaysVisible: false
Text: Back | Transition: questgiver_greeting | Color: 180,180,180

[questgiver_skill_pass]
Impressive! Your skill speaks for itself.\nYou may pass freely, warrior.
@interaction Command: AddPlayerKey,eastern_gate_unlocked
Text: Thank you, Keeper | Color: 255,215,0
