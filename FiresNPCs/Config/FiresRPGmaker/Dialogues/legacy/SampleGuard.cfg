# ???????????????????????????????????????????????????????????????
# Sample Guard — Item/key gated access with multiple paths
# Demonstrates: @interaction auto-execute, player keys as flags,
#   CustomValue counters, health check, circular transitions,
#   hidden options (AlwaysVisible:false), RandomTransition
# ???????????????????????????????????????????????????????????????

[guard_gate]
Halt! No one passes without authorisation.\nState your business.
@interaction Command: AddCustomValue,guard_visits,1
Text: I have a pass | Condition: HasPlayerKey,gate_pass | Transition: guard_enter | Color: 100,255,100
Text: I have a pass | Condition: !HasPlayerKey,gate_pass | AlwaysVisible: true | OverrideError: You do not possess a gate pass.
Text: I demand entry! | Transition: guard_demand | Color: 255,100,100
Text: Can I buy a pass? | Transition: guard_buypass | Condition: HasItem,Coins,50 | AlwaysVisible: true | OverrideError: Looks like you can't afford it (50 coins).
Text: I'll come back later | Color: 150,150,150

[guard_enter]
Ah, a valid pass. Welcome inside, %playername%.\nDon't cause any trouble.
@interaction Command: AddPlayerKey,entered_guard_gate
@interaction Command: Teleport,500,30,500
Text: Thank you

[guard_demand]
Ha! You and what army?\nGet lost before I lose my patience.
Text: Fine, fine... | Transition: guard_gate
Text: I won't ask again! | Condition: HealthMore,80 | Transition: guard_fight | Color: 255,50,50
Text: I won't ask again! | Condition: HealthLess,80 | AlwaysVisible: true | OverrideError: You look too weak to fight (need 80+ health).

[guard_fight]
You dare threaten me?!\nTake this!
@interaction Command: Damage,25
@interaction Command: PlayAnimation,attack_mace
Text: Ow! I'll be going now... | Transition: guard_gate | Color: 180,180,180

[guard_buypass]
A pass costs 50 coins. Pay up or move along.
Text: Here, take my coins | Command: RemoveItem,Coins,50 | Command: AddPlayerKey,gate_pass | Condition: HasItem,Coins,50 | Transition: guard_bought | Icon: Coins | Color: 255,215,0
Text: That's too expensive | Transition: guard_gate | Color: 180,180,180

[guard_bought]
Pleasure doing business, %playername%.\nYour pass is valid indefinitely. Now get moving.
Text: Head through the gate | Transition: guard_enter | Color: 100,255,100
Text: Thanks, I'll come back later

[guard_random_tip]
Psst... want a tip about what's on the other side?
Text: Sure, tell me | RandomTransition: guard_tip_a,guard_tip_b,guard_tip_c | Color: 180,220,255
Text: No thanks | Transition: guard_gate | Color: 180,180,180

[guard_tip_a]
There's a blacksmith inside who can upgrade your gear.\nTell him Bjorn sent you.
@interaction Command: AddPlayerKey,knows_blacksmith
Text: Good to know | Transition: guard_gate

[guard_tip_b]
Watch out for the dogs in the courtyard.\nThey bite!
Text: I'll keep my distance | Transition: guard_gate

[guard_tip_c]
I heard there's treasure hidden under the old well.\nBut you didn't hear that from me.
@interaction Command: AddPin,Old Well,510,28,485
Text: My lips are sealed | Transition: guard_gate
