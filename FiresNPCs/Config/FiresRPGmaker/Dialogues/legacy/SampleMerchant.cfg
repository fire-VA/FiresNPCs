# ???????????????????????????????????????????????????????????????
# Sample Merchant Dialogue — Branching shop/quest/rumour flow
# Demonstrates: transitions, commands, icons, colors, %playername%
# ???????????????????????????????????????????????????????????????

[merchant_greeting]
Ahoy, %playername%!\nWhat brings you to my humble shop today?
Text: Show me your wares | Transition: merchant_shop | Icon: Coins | Color: 255,215,0
Text: Got any work for me? | Transition: merchant_work | Icon: TrophyBoar
Text: Tell me about this area | Transition: merchant_lore | Color: 180,220,255
Text: Just passing through — farewell | Color: 150,150,150

[merchant_shop]
I've got everything an adventurer could need.\nCoins talk, friend!
@interaction Command: PlayAnimation,emote_wave
Text: Buy a Healing Mead | Command: RemoveItem,Coins,20 | Command: GiveItem,MeadHealthMinor,3,1 | Condition: HasItem,Coins,20 | Icon: MeadHealthMinor
Text: Buy 10 Arrows | Command: RemoveItem,Coins,5 | Command: GiveItem,ArrowWood,10,1 | Condition: HasItem,Coins,5 | Icon: ArrowWood
Text: I can't afford anything... | Condition: !HasItem,Coins,5 | AlwaysVisible: false
Text: Back | Transition: merchant_greeting | Color: 180,180,180

[merchant_work]
Let me think... yes, I could use someone brave.
Text: I'll take the job! | Command: GiveQuest,merchant_delivery | Condition: NotHasQuest,merchant_delivery | Condition: QuestNotFinished,merchant_delivery | Transition: merchant_accepted
Text: I'm already on it | Condition: HasQuest,merchant_delivery | Transition: merchant_progress
Text: I finished your task | Condition: QuestProgressDone,merchant_delivery | Command: FinishQuest,merchant_delivery | Command: GiveItem,Coins,100,1 | Transition: merchant_reward
Text: No thanks | Transition: merchant_greeting | Color: 180,180,180

[merchant_accepted]
Excellent! Deliver this package to the village elder.\nDon't dawdle — he's waiting.
@interaction Command: AddPlayerKey,merchant_gave_package
Text: I'm on my way | Transition: merchant_greeting

[merchant_progress]
Still working on that delivery?\nHurry along, %playername%!
Text: Right, heading out now | Color: 180,180,180

[merchant_reward]
Well done, %playername%! Here are 100 coins for your trouble.\nCome back anytime you need work.
Text: Thank you! | Transition: merchant_greeting

[merchant_lore]
This land used to be peaceful, until the trolls moved in.\nNow hardly anyone travels the old road through the Black Forest.
@interaction Command: AddPlayerKey,heard_merchant_lore
Text: Sounds dangerous — where exactly? | Command: AddPin,Old Troll Road,820,45,620 | Transition: merchant_greeting | Color: 255,200,100
Text: Thanks for the warning | Transition: merchant_greeting
