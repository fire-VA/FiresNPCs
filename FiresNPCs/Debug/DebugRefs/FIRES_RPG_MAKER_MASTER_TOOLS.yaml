hoe:

# ?? VANILLA TERRAIN (WEC Integration) ?????????????????????????????????????

  - name: Level
    description: |-
      Flattens terrain.
      Hold <mod1> to smooth.
      Hold <mod2> for free mode.
      Hold <alt> for player height.
    icon: mud_road
    command: terrain level smooth=<mod1>?.5:0 <area>
    index: 10
    terrainGrid: -<mod2>
    playerHeight: <alt>

  - name: Raise
    description: |-
      Raises terrain.
      Hold <mod1> to smooth.
      Hold <mod2> for free mode.
    icon: raise
    command: terrain raise=<h> smooth=<mod1>?.5:0 <area>
    initialHeight: 0.2
    terrainGrid: -<mod2>
    snapGround: true

