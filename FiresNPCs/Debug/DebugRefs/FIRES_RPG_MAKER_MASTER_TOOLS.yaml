# ?? DATA/OBJECT TOOLS (Hoe) ???????????????????????????????????????????????

  - name: Clear Object Data
    description: |-
      <#00ffff>Clear object datas</color> in area.
    icon: Wisp
    command: data clear <area> height=<h>
    highlight: true

  - name: Invisible Piece Hoe
    description: |-
      Make build pieces <#00ffff>invisible</color>.
      Hold <#FFF000><mod1></color> to undo.
      Hold <#FFF000><mod2></color> to affect connected pieces.
    icon: TrophyWraith
    commands:
      - command: object health=-1 f=WearNTear,health,-4 f=WearNTear,broken,vfx_odin_despawn
      - command: data remove=WearNTear.m_broken; object health=-1 f=WearNTear,health,-1
        keys: <mod1>
      - command: object health=-1 f=WearNTear,health,-4 f=WearNTear,broken,vfx_odin_despawn connect
        keys: <mod2>
      - command: data remove=WearNTear.m_broken; object health=-1 f=WearNTear,health,-1 connect
        keys: <mod1>,<mod2>
    instant: false

  - name: Invulnerable Piece (WNT New)
    description: |-
      Make objects <#00ffff>invulnerable</color>.
      WearNTear = <#669900>New</color>
      Hold <#FFF000><mod1></color> to undo.
      Hold <#FFF000><mod2></color> to affect connected pieces.
    icon: woodwall
    commands:
      - command: object health=-1 f=WearNTear,health,-1
      - command: data remove=health,WearNTear.m_health
        keys: <mod1>
      - command: object health=-1 f=WearNTear,health,-1 connect
        keys: <mod2>
      - command: data remove=health,WearNTear.m_health connect
        keys: <mod1>,<mod2>
    highlight: true
    instant: false

  - name: Invulnerable Piece (WNT Worn)
    description: |-
      Make objects <#00ffff>invulnerable</color>.
      WearNTear = <#CC6600>Worn</color>
      Hold <#FFF000><mod1></color> to undo.
      Hold <#FFF000><mod2></color> to affect connected pieces.
    icon: wood_wall_half
    commands:
      - command: object health=-1 f=WearNTear,health,-2
      - command: data remove=health,WearNTear.m_health
        keys: <mod1>
      - command: object health=-1 f=WearNTear,health,-2 connect
        keys: <mod2>
      - command: data remove=health,WearNTear.m_health connect
        keys: <mod1>,<mod2>
    highlight: true
    instant: false

  - name: Invulnerable Piece (WNT Broken)
    description: |-
      Make objects <#00ffff>invulnerable</color>.
      WearNTear = <#CC0000>Broken</color>
      Hold <#FFF000><mod1></color> to undo.
      Hold <#FFF000><mod2></color> to affect connected pieces.
    icon: wood_wall_quarter
    commands:
      - command: object health=-1 f=WearNTear,health,-4
      - command: data remove=health,WearNTear.m_health
        keys: <mod1>
      - command: object health=-1 f=WearNTear,health,-4 connect
        keys: <mod2>
      - command: data remove=health,WearNTear.m_health connect
        keys: <mod1>,<mod2>
    highlight: true
    instant: false

  - name: Restore Default Health
    description: |-
      Set object's health <#00ffff>back to default</color> in area.
    icon: MechanicalSpring
    command: data remove=health,WearNTear.m_health <area> height=<h>
    highlight: true

  - name: Indestructible Nature Object
    description: |-
      Make nature objects <#00ffff>indestructible</color>.
      Hold <#FFF000><mod1></color> to undo.
    icon: FlametalOreNew
    commands:
      - command: tool_object health=-1 f=WearNTear,health,-1
      - command: tool_object f=Destructible,minToolTier,999 f=TreeBase,minToolTier,999 f=MineRock5,minToolTier,999
      - command: data remove=Destructible.m_minToolTier,TreeBase.m_minToolTier,MineRock5.m_minToolTier,health,WearNTear.m_health type=Destructible,TreeBase,MineRock5 <area>
        keys: <mod1>
    highlight: true
    instant: false

