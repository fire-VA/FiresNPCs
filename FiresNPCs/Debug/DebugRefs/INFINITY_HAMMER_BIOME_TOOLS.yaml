# ==========================================
# RESET/CLEAR BIOME TOOLS
# ==========================================

- name: Reset Biome Overlay
  description: |-
    <#FFFFFF>Reset</color> biome overlay to original.
    Restores terrain to world's natural biome.
    Hold <mod1> for single use.
  icon: Hoe
  command: paint_biome reset <area>
  continuous: -<mod1>
  snapGround: true

- name: Reset All Biome Overlays
  description: |-
    <#FFFFFF>Reset ALL</color> biome overlays in the world.
    Restores all painted terrain to original biomes.
  icon: Hammer
  command: reset_biome_overlay all
  instant: true

# ?????????????????????????????????????????????????????????????
# ?                                                           ?
# ? CLUTTER/GRASS PAINTING TOOLS                              ?
# ?                                                           ?
# ? Use Alt+Scroll to cycle through clutter types!            ?
# ?                                                           ?
# ?????????????????????????????????????????????????????????????

# ==========================================
# MAIN CLUTTER TOOL (with Alt+Scroll cycling)
# ==========================================

- name: Paint Clutter
  description: |-
    Paint <#90EE90>grass/vegetation</color> at cursor.
    <#FFF000>Alt+Scroll</color> to cycle clutter types!
    Hold <mod1> for single use.
    Hold <mod2> for free mode.
  icon: Dandelion
  commands:
    - command: clutter_cycle_mode on
    - command: paint_clutter <area>
  continuous: -<mod1>
  terrainGrid: -<mod2>
  snapGround: true

- name: Clear Clutter
  description: |-
    <#FF6666>Remove</color> painted clutter in area.
    Hold <mod1> for single use.
  icon: Hoe
  command: clear_clutter <area>
  continuous: -<mod1>
  snapGround: true

- name: Clear All Clutter
  description: |-
    <#FF6666>Remove ALL</color> painted clutter in the world.
  icon: Hammer
  command: clear_clutter all
  instant: true

