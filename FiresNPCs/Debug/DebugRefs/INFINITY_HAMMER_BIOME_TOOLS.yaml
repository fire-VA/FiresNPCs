# ?????????????????????????????????????????????????????????????
# ?                                                           ?
# ? BIOME OVERLAY & CLUTTER PAINTING TOOLS                    ?
# ?                                                           ?
# ? Biome tools paint terrain textures (snow, lava, etc)      ?
# ? Clutter tools paint grass and vegetation                  ?
# ? Works ANYWHERE regardless of actual world biome           ?
# ?                                                           ?
# ?????????????????????????????????????????????????????????????
#
# Add these entries to your infinity_hammer.yaml hoe section
# These use console commands from FiresRPGmaker

hoe:
# ==========================================
# SNOW OVERLAY TOOLS
# ==========================================

- name: Paint Snow
  description: |-
    Paint <#AADDFF>snow overlay</color> on terrain.
    Works in ANY biome - ignores world biome!
    Hold <mod1> for single use.
    Hold <mod2> for free mode.
  icon: Crystal
  command: paint_biome snow <area>
  continuous: -<mod1>
  terrainGrid: -<mod2>
  snapGround: true

- name: Paint Snow Large
  description: |-
    Paint <#AADDFF>large snow overlay</color> on terrain.
    Works in ANY biome - ignores world biome!
  icon: Crystal
  command: paint_biome snow 15
  terrainGrid: false
  snapGround: true

# ==========================================
# LAVA/ASHLANDS OVERLAY TOOLS
# ==========================================

- name: Paint Lava
  description: |-
    Paint <#FF6600>lava/ash overlay</color> on terrain.
    Creates Ashlands charred ground texture.
    Works in ANY biome!
    Hold <mod1> for single use.
    Hold <mod2> for free mode.
  icon: FlametalOre
  command: paint_biome lava <area>
  continuous: -<mod1>
  terrainGrid: -<mod2>
  snapGround: true

- name: Paint Lava Large
  description: |-
    Paint <#FF6600>large lava/ash overlay</color> on terrain.
    Creates Ashlands charred ground texture.
    Works in ANY biome!
  icon: FlametalOreNew
  command: paint_biome lava 15
  terrainGrid: false
  snapGround: true

