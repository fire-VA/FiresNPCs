# ?????????????????????????????????????????????????????????????????????????????
# ?                                                                             ?
# ?  VERDANT'S ASCENT - SNOW CLUTTER TOOLS                                      ?
# ?                                                                             ?
# ?  Interactive snow that bends when walked through and leaves                 ?
# ?  persistent trails. Snow clutter is persistent (survives zone               ?
# ?  reload); trails reset when leaving the zone.                               ?
# ?                                                                             ?
# ?  Add these entries to your infinity_hammer.yaml under the hoe: section.     ?
# ?                                                                             ?
# ?????????????????????????????????????????????????????????????????????????????

# ??????????????????????????????????????????????????????????????????????????????
# SNOW PLACEMENT TOOLS
# ??????????????????????????????????????????????????????????????????????????????

  - name: Paint Snow Clutter
    description: |-
      <#EEEEFF>Paint Snow Clutter</color> at cursor position.
      Dense instanced snow that bends when walked through.
      <#FFFF00>Scroll</color> to adjust radius.
      Persistent — survives zone reload.
    icon: FreezeGland
    command: paint_snow_clutter <area>
    continuous: -<mod1>
    snapGround: true

  - name: Paint Snow (Small)
    description: |-
      <#EEEEFF>Small Snow Patch</color> (3m radius).
      Instanced snow clutter with player interaction.
    icon: FreezeGland
    command: paint_snow_clutter 3
    instant: false
    snapGround: true

  - name: Paint Snow (Medium)
    description: |-
      <#EEEEFF>Medium Snow Patch</color> (6m radius).
      Instanced snow clutter with player interaction.
    icon: FreezeGland
    command: paint_snow_clutter 6
    instant: false
    snapGround: true

  - name: Paint Snow (Large)
    description: |-
      <#EEEEFF>Large Snow Patch</color> (12m radius).
      Instanced snow clutter with player interaction.
    icon: FreezeGland
    command: paint_snow_clutter 12
    instant: false
    snapGround: true

  - name: Paint Snow (XLarge)
    description: |-
      <#EEEEFF>Extra Large Snow Field</color> (20m radius).
      Instanced snow clutter with player interaction.
    icon: FreezeGland
    command: paint_snow_clutter 20
    instant: false
    snapGround: true

# ??????????????????????????????????????????????????????????????????????????????
# SNOW REMOVAL TOOLS
# ??????????????????????????????????????????????????????????????????????????????

  - name: Clear Snow Clutter
    description: |-
      <#FF4444>Remove</color> snow clutter in area.
      <#FFFF00>Scroll</color> to adjust removal radius.
    icon: SledgeDemolisher
    command: clear_snow_clutter <area>
    continuous: -<mod1>
    snapGround: true

  - name: Clear All Snow
    description: |-
      <#FF4444>Remove ALL</color> snow clutter everywhere.
      Also clears persistence data.
    icon: SledgeDemolisher
    command: clear_snow_clutter all
    instant: false

# ??????????????????????????????????????????????????????????????????????????????
# SNOW TRAIL TOOLS
# ??????????????????????????????????????????????????????????????????????????????

  - name: Enable Snow Trails
    description: |-
      <#EEEEFF>Enable</color> snow trail stamping.
      Walk through painted snow to leave persistent trails.
      Trails reset when you leave the zone.
    icon: FreezeGland
    command: snow_trail on
    instant: false

  - name: Disable Snow Trails
    description: |-
      <#FF6600>Disable</color> snow trail stamping.
      Existing trails are cleared.
    icon: Torch
    command: snow_trail off
    instant: false

  - name: Reset Snow Trails
    description: |-
      <#00FFFF>Reset</color> all snow trails.
      Clutter will respawn on next zone reload.
    icon: FreezeGland
    command: snow_trail reset
    instant: false
