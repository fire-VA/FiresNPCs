hammer:
# ==========================================
# PIPETTE TOOLS
# ==========================================

- name: Pipette
  description: |-
    Press <mod1> to pick up.
    Press <mod2> to freeze.
  icon: hammer
  command: hammer pick=<mod1> freeze=<mod2>
  index: 1

- name: Building pipette
  description: |-
    Select entire buildings.
    Press <mod1> to pick up.
    Press <mod2> to freeze.
  icon: hammer
  command: hammer connect pick=<mod1> freeze=<mod2>

- name: Area pipette
  description: |-
    Select multiple objects.
    Press <mod1> to pick up.
    Press <mod2> to freeze.
  icon: hammer
  command: hammer pick=<mod1> freeze=<mod2> height=<h> <area>
  initialHeight: 0
  highlight: true

# ==========================================
# ADMIN & PROTECTION TOOLS
# ==========================================

- name: Admin Buildings
  description: |-
    Set objects in area applies <#00ffff>all admin effects</color>.<size=10>
    - <#fff000>Infinite Health</color> for build pieces, destructible objects.
    - <#fff000>Infinite Fuel</color> for fireplaces, bathtubs.
    - <#fff000>Irremovable</color> build pieces, itemstands.
    - <#fff000>Unpickable</color> pickable objects.
    </size>
  icon: HelmetMage
  commands: 
  - command: tool_object health=-1 f=WearNTear,health,-1
  - command: tool_object f=Destructible,minToolTier,999 f=TreeBase,minToolTier,999 f=MineRock5,minToolTier,999
  - command: tool_object type=Piece f=Piece,canBeRemoved,false <area>
  - command: tool_object type=ItemStand f=ItemStand,canBeRemoved,false <area>
  - command: tool_object type=Fireplace f=Fireplace,infiniteFuel,true
  - command: tool_object id=piece_bathtub f=Smelter,fuel,10 f=Smelter,fuelPerProduct,0
  - command: tool_object type=Pickable f=Pickable,picked,1 f=Pickable,hideWhenPicked,vfx_odin_despawn <area>
  highlight: true
  instant: false

- name: Area Cannot Be Removed & indestructible
  description: Pieces can't be removed in the area! Also turns off primary and random target and applies -1 health / wearntear health.
  icon: hammer
  command: object f=WearNTear,health,-1 health=-1 f=Piece,canBeRemoved,false f=Piece,primaryTarget,false f=Piece,randomTarget,false height=<h> <area>
  initialHeight: 0
  highlight: true

- name: WearNTear Burnable FALSE
  description: Set structures to not be burnable at all in area.
  icon: BombSmoke
  command: object type=Structure f=WearNTear,burnable,false <area> height=<h>
  initialHeight: 0
  highlight: true

# ==========================================
# SCALE & TRANSFORM TOOLS
# ==========================================

- name: Scale Objects Small AREA
  description: Scales objects in the area to half size (0.5).
  icon: piece_workbench
  command: object scale=.5 <area> height=<h>
  initialHeight: 0
  highlight: true
  index: 20

- name: Reset Object Scale AREA
  description: Resets object scales in the area to normal (1).
  icon: piece_workbench
  command: object scale=1 <area> height=<h>
  initialHeight: 0
  highlight: true
  index: 21

- name: Slight Tilt Objects AREA
  description: Slightly tilts objects in the area (0.5 degrees on all axes, 50% chance).
  icon: wood_wall_2x2
  command: object rotate=0.5,0.5,0.5 <area> height=<h> chance=0.5
  initialHeight: 0
  highlight: true
  index: 24

- name: rundown twists
  description: Randomly tilts objects in the area (-5 to 5 degrees on all axes, 50% chance).
  icon: wood_wall_2x2
  command: object rotate=-2-2,-2-2,-2-2 <area> height=<h> origin=object
  initialHeight: 0
  highlight: true
  index: 26

# ==========================================
# VISIBILITY & INTERACTION TOOLS
# ==========================================

- name: Invisible Piece
  description: |-
    Make build pieces invisible.
    Hold <#FFF000><mod1></color> to undo.
    Hold <#FFF000><mod2></color> to affect connected pieces.
  icon: TrophyWolf
  commands: 
  - command: object health=-1 f=WearNTear,health,-4 f=WearNTear,broken,vfx_odin_despawn
  - command: data remove=WearNTear.m_broken,health,WearNTear.m_health
    keys: <mod1>
  - command: object health=-1 f=WearNTear,health,-4 f=WearNTear,broken,vfx_odin_despawn connect
    keys: <mod2>
  - command: data remove=WearNTear.m_broken,health,WearNTear.m_health connect
    keys: <mod1>,<mod2>
  instant: false

- name: Disable Interaction AREA
  description: Disables interaction on objects in the area.
  icon: Eyescream
  command: tweak_object interact=false <area> height=<h>
  initialHeight: 0
  highlight: true

- name: Enable Interaction AREA
  description: Enables interaction on objects in the area.
  icon: Eyescream
  command: tweak_object interact=true <area> height=<h>
  initialHeight: 0
  highlight: true

# ==========================================
# CREATOR & OWNERSHIP TOOLS
# ==========================================

- name: Creator 0 AREA
  description: Set object creator to 0 in area.
  icon: piece_xmascrown
  command: object creator=0 <area> height=<h>
  initialHeight: 0
  highlight: true

# ==========================================
# CHEST & CONTAINER TOOLS
# ==========================================

- name: Magic Chest Tweaker
  description: Adds wood and stone to the selected chest, sets 2min respawn, and renames it.
  icon: ChestTreasure
  command: tweak_chest item=Wood,1,500,999 item=Stone,1,500,999 respawn=2 chance=1.0 maxamount=2 minamount=2 name="Magic Chest"

# ==========================================
# FIREPLACE & FUEL TOOLS
# ==========================================

- name: Area Fueler
  description: Fireplaces in area get infinite fuel! Come on baby light my fire!
  icon: bonfire
  command: object type=Fireplace f=Fireplace,infiniteFuel,true height=<h> <area>
  initialHeight: 0
  highlight: true

# ==========================================
# WEAR & DAMAGE STATE TOOLS
# ==========================================

- name: Worn Pieces
  description: |-
    Sets all pieces in the area to worn with infinite health.
    Hold <mod1> for single use.
    Hold <mod2> for free mode.
  icon: SurtlingCore
  command: object type=Structure f=WearNTear,health,-2 health=-1 <area> height=<h>
  initialHeight: 0
  highlight: true
  continuous: -<mod1>
  snapGround: true
  terrainGrid: -<mod2>

- name: Broken Pieces Chance
  description: |-
    Randomly sets 20% of pieces in the area to broken with infinite health.
    Hold <mod1> for single use.
    Hold <mod2> for free mode.
  icon: BlackCore
  command: object type=Structure f=WearNTear,health,-4 health=-1 chance=0.2 <area> height=<h>
  initialHeight: 0
  highlight: true
  continuous: -<mod1>
  snapGround: true
  terrainGrid: -<mod2>

# ==========================================
# DESTRUCTION & REMOVAL TOOLS
# ==========================================

- name: AreaRuiner
  description: Randomly removes pieces in the highlighted area.
  icon: SledgeDemolisher
  command: object remove chance=0.5 type=Piece height=<h> <area>
  initialHeight: 0
  highlight: true

# ==========================================
# DATA MANAGEMENT TOOLS
# ==========================================

- name: Data Grab
  description: Haxboi data gräbz
  icon: hammer
  command: data save=hax <area>
  initialHeight: 0
  highlight: true

- name: Clear Object Data AREA
  description: Clear object data in AREA
  icon: hammer
  command: data clear <area> height=<h>
  initialHeight: 0
  highlight: true

# ==========================================
# HEALTH MANAGEMENT TOOLS
# ==========================================

- name: Structure Health DEFAULT AREA
  description: Set structure health to default in area.
  icon: hammer
  command: data remove=health,WearNTear.m_health type=Structure <area> height=<h>
  initialHeight: 0
  highlight: true

- name: Structure Health Infinite AREA
  description: Set structure health to infinite in area.
  icon: hammer
  command: object type=Structure health=-1 f=WearNTear,health,-1 <area>
  initialHeight: 0
  highlight: true

- name: Destructible & Treebase Health Infinite AREA
  description: Set object minToolTier to 1073741823 in area.
  icon: hammer
  command: object f=Destructible,minToolTier,1073741823 f=TreeBase,minToolTier,1073741823 <area>
  initialHeight: 0
  highlight: true

- name: Health Default AREA
  description: Clear health and WNT health data in AREA
  icon: hammer
  command: data remove=health,WearNTear.m_health <area> height=<h>
  initialHeight: 0
  highlight: true

# ==========================================
# SUPPORT & STABILITY TOOLS
# ==========================================

- name: noSupportWear 0 AREA
  description: Set object noSupportWear to 0 in area.
  icon: woodiron_pole
  command: object f=WearNTear,noSupportWear,false <area> height=<h>
  initialHeight: 0
  highlight: true


