# ║                                                                             ║
# ║  VERDANT'S ASCENT - EMISSIVE CLUTTER TOOLS                                 ║
# ║                                                                             ║
# ║  Emissive vegetation that glows.                                            ║
# ║  Prefabs: VA_InstancedForestEmissive, VA_vassEmission, VA_FernsEmissive     ║
# ║                                                                             ║
# ║  Add these entries to your infinity_hammer.yaml under the hoe: section.     ║
# ║                                                                             ║
# ═══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# FOREST EMISSIVE PLACEMENT TOOLS
# ══════════════════════════════════════════════════════════════════════════════

  - name: Paint Forest Emissive
    description: |-
      <#66FF88>Paint Forest Emissive Clutter</color> at cursor position.
      Glowing instanced forest groundcover vegetation.
      <#FFFF00>Scroll</color> to adjust radius.
      Persistent — survives zone reload.
      Hold <mod1> for single use.
    icon: AncientSeed
    command: paint_clutter VA_InstancedForestEmissive <area>
    continuous: -<mod1>
    snapGround: false

  - name: Paint Forest Emissive (Small)
    description: |-
      <#66FF88>Small Forest Emissive Patch</color> (3m radius).
      Glowing instanced forest groundcover.
    icon: AncientSeed
    command: paint_clutter VA_InstancedForestEmissive 3
    instant: false
    snapGround: false

  - name: Paint Forest Emissive (Medium)
    description: |-
      <#66FF88>Medium Forest Emissive Patch</color> (6m radius).
      Glowing instanced forest groundcover.
    icon: AncientSeed
    command: paint_clutter VA_InstancedForestEmissive 6
    instant: false
    snapGround: false

  - name: Paint Forest Emissive (Large)
    description: |-
      <#66FF88>Large Forest Emissive Patch</color> (12m radius).
      Glowing instanced forest groundcover.
    icon: AncientSeed
    command: paint_clutter VA_InstancedForestEmissive 12
    instant: false
    snapGround: false

  - name: Paint Forest Emissive (XLarge)
    description: |-
      <#66FF88>Extra Large Forest Emissive Field</color> (20m radius).
      Glowing instanced forest groundcover.
    icon: AncientSeed
    command: paint_clutter VA_InstancedForestEmissive 20
    instant: false
    snapGround: false

