# ?????????????????????????????????????????????????????????????????????????????????
# ?                                                                               ?
# ?  VERDANT'S ASCENT - STANDALONE ICE PLACEMENT TOOLS                            ?
# ?                                                                               ?
# ?  Dual-mode ice tool:                                                          ?
# ?    - On WATER: Creates floating solid ice disk with collision,                ?
# ?      hole-breaking, and climb-out interaction.                                ?
# ?    - On LAND: Paints ice material overlay on terrain with                     ?
# ?      slippery physics.                                                        ?
# ?    - Overlapping disks auto-combine into seamless surfaces.                   ?
# ?                                                                               ?
# ?  CONTROLS (same as DirtFloor terrain tools):                                  ?
# ?    - Scroll to adjust radius                                                  ?
# ?    - Page Up/Down to adjust height offset                                     ?
# ?    - snapGround: false — ruler stays at cursor, NOT snapped                   ?
# ?    - Height = ruler Y + offset                                                ?
# ?                                                                               ?
# ?  Add these entries to your infinity_hammer.yaml under the hoe: section.       ?
# ?                                                                               ?
# ?????????????????????????????????????????????????????????????????????????????????

# ??????????????????????????????????????????????????????????????????????????????
# ICE PLACEMENT TOOLS
# ??????????????????????????????????????????????????????????????????????????????

  - name: Place Ice
    description: |-
      <#00FFFF>Place Ice</color> - auto-detects surface type.
      On <#00AAFF>water</color>: floating solid disk with collision.
      On <#88AA44>land</color>: terrain ice overlay (slippery).
      <#FFFF00>Scroll</color> to adjust radius.
      <#00FF00>Page Up/Down</color> to adjust height offset.
      Overlapping disks auto-combine.
      Hold <mod1> for single placement.
    icon: FreezeGland
    command: place_ice <area> offset=<h>
    continuous: -<mod1>
    snapGround: false

  - name: Place Ice (Ground Snap)
    description: |-
      <#00FFFF>Place Ice</color> snapped to ground.
      Auto-detects water vs land.
      <#FFFF00>Scroll</color> to adjust radius.
      <#00FFFF>Snaps to ground by default.</color>
      Hold <mod1> for single placement.
    icon: FreezeGland
    command: place_ice <area> offset=<h>
    continuous: -<mod1>
    snapGround: true

# ??????????????????????????????????????????????????????????????????????????????
# FORCED-MODE ICE TOOLS (bypass auto-detection)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Place Ice on Land
    description: |-
      <#00FFFF>Force Ice Overlay</color> on terrain (land only).
      Bypasses water detection — always creates terrain overlay.
      Use when auto-detect incorrectly picks floating mode near coasts.
      <#FFFF00>Scroll</color> to adjust radius.
      <#00FF00>Page Up/Down</color> to adjust height.
      Hold <mod1> for single placement.
    icon: FreezeGland
    command: place_ice_land <area> offset=<h>
    continuous: -<mod1>
    snapGround: false

  - name: Place Ice on Water
    description: |-
      <#00FFFF>Force Floating Ice</color> on water only.
      Bypasses water detection — always creates floating disk.
      Use when auto-detect incorrectly picks terrain mode.
      <#FFFF00>Scroll</color> to adjust radius.
      <#00FF00>Page Up/Down</color> to adjust height.
      Hold <mod1> for single placement.
    icon: Crystal
    command: place_ice_water <area> offset=<h>
    continuous: -<mod1>
    snapGround: false

# ??????????????????????????????????????????????????????????????????????????????
# ICE BREAKING TOOLS (standalone floating ice only)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Break Standalone Ice
    description: |-
      <#FFFFFF>Break hole</color> in floating ice disk.
      <#FFFF00>Scroll</color> to adjust hole size.
      Only works on floating ice (not terrain overlay).
    icon: PickaxeIron
    command: break_standalone_ice <area>
    continuous: false
    snapGround: false

# ??????????????????????????????????????????????????????????????????????????????
# LAND ICE HEIGHT MODIFICATION TOOLS (terrain ice only)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Raise Land Ice
    description: |-
      <#00FFFF>Raise</color> land ice surface height.
      <#FFFF00>Scroll</color> to adjust radius.
      Hold to raise continuously.
    icon: FreezeGland
    command: ice_land_raise raise=0.5 <area>
    continuous: -<mod1>
    snapGround: false

  - name: Lower Land Ice
    description: |-
      <#00FFFF>Lower</color> land ice surface height.
      <#FFFF00>Scroll</color> to adjust radius.
      Hold to lower continuously.
    icon: FreezeGland
    command: ice_land_lower lower=0.5 <area>
    continuous: -<mod1>
    snapGround: false

  - name: Level Land Ice
    description: |-
      <#00FFFF>Level</color> land ice to target height.
      <#FFFF00>Scroll</color> to adjust radius.
      Flattens ice to the clicked height.
    icon: FreezeGland
    command: ice_land_level <area>
    continuous: -<mod1>
    snapGround: false

  - name: Smooth Land Ice
    description: |-
      <#00FFFF>Smooth</color> land ice surface.
      <#FFFF00>Scroll</color> to adjust radius.
      Averages height for a smooth surface.
    icon: FreezeGland
    command: ice_land_smooth <area>
    continuous: -<mod1>
    snapGround: false

# ??????????????????????????????????????????????????????????????????????????????
# FLOATING ICE HEIGHT MODIFICATION TOOLS (water ice only)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Raise Floating Ice
    description: |-
      <#00FFFF>Raise</color> floating ice top surface.
      Builds ridges and hills on the iceberg.
      <#FFFF00>Scroll</color> to adjust radius.
      Hold to raise continuously.
    icon: Crystal
    command: ice_water_raise raise=0.5 <area>
    continuous: -<mod1>
    snapGround: false

  - name: Lower Floating Ice
    description: |-
      <#00FFFF>Lower</color> floating ice top surface.
      <#FFFF00>Scroll</color> to adjust radius.
      Hold to lower continuously.
    icon: Crystal
    command: ice_water_lower lower=0.5 <area>
    continuous: -<mod1>
    snapGround: false

  - name: Smooth Floating Ice
    description: |-
      <#00FFFF>Smooth</color> floating ice surface.
      <#FFFF00>Scroll</color> to adjust radius.
      Averages height for a smooth surface.
    icon: Crystal
    command: ice_water_smooth <area>
    continuous: -<mod1>
    snapGround: false

  - name: Delete Floating Ice
    description: |-
      <#FF4444>Remove</color> floating ice disks in area.
      <#FFFF00>Scroll</color> to adjust removal radius.
    icon: SledgeDemolisher
    command: delete_ice_water <area>
    continuous: -<mod1>
    snapGround: false

# ??????????????????????????????????????????????????????????????????????????????
# ICE REMOVAL TOOLS (all types)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Delete Ice
    description: |-
      <#FF4444>Remove</color> all standalone ice disks in area.
      Deletes both land and floating ice.
      <#FFFF00>Scroll</color> to adjust removal radius.
    icon: SledgeDemolisher
    command: delete_ice <area>
    continuous: -<mod1>
    snapGround: false

# ??????????????????????????????????????????????????????????????????????????????
# FROZEN WATER TOOLS (converts existing custom water to/from ice)
# ??????????????????????????????????????????????????????????????????????????????

  - name: Freeze Water
    description: |-
      <#00FFFF>Freeze</color> existing custom water to solid ice.
      Click on custom water to freeze.
      Creates walkable ice surface on top.
    icon: FreezeGland
    command: freeze_water
    instant: false

  - name: Thaw Ice
    description: |-
      <#FF6600>Thaw</color> frozen custom water back to liquid.
      Click on frozen water to thaw.
    icon: Torch
    command: thaw_water
    instant: false

  - name: Break Ice Hole
    description: |-
      <#FFFFFF>Break hole</color> in frozen custom water.
      <#FFFF00>Scroll</color> to adjust hole size.
      Creates opening to water below.
    icon: PickaxeIron
    command: break_ice <area>
    continuous: false
    snapGround: false
