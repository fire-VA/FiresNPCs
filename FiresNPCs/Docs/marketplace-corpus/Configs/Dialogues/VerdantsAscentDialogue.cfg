[VAINFO2
Verdant's Ascent uses mods to create a rich RPG experience with classes, talents, stats, Npc's and Quests... Focusing on Immersive Towns that feel like home, Quests to extend your Valheim Experience, and Intricate Systems for Building the character of your dreams... Between class choices, weapons, armor, Skills, and set bonuses, you can build a completely uinique Viking! It can be a lot to take in, feel free to ask questions in the discord about anything!
Text: I'd like to learn more... | Transition: SpawnTutorials2 | Icon: StaffSwamp_TW

[shrinetutorial
Wayshrines are the way to fast travel around in Verdant's Ascent... When you find a wayshrine it will automatically save the location to your character. Only saved wayshrines will show up available to teleport to... The wayshrines are operated by three buttons...The Left, Right, and FastTravel buttons... Select the WayShrine you want to travel to and hit the Travel button to teleport! If you ever forget how to use them there is a small tutorial popup anytime you get close enough to one that shows on the left of your screen.
Text: I'd like to learn more... | Transition: SpawnTutorials2 | Icon: StaffSwamp_TW

