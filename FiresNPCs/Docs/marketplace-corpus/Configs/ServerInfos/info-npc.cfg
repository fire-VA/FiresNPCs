          Ho there, adventurer! Welcome to Raven's Rest!</color>

<color=#00f3ff>I’m Eirik, and I’m thrilled to share the wonders of this place with you!</color>
 
<color=#FFD700> We’ve got it all: </color>

<color=#00f3ff>Theres a market where you can buy and sell goods to your heart’s content, and a trusted banker to keep your coins safe. 

Over at the inn you can find a bed to rest your tired legs, and they have a full kitchen that can prepare you a nice meal!

Up the hill is the Guild Hall where you can train your skills or pick up quests, and down this dirt path youll find a small dock with free ships if you prefer to explore that way. 

Take a look around, im sure you will love this place as much as i do! This settlement’s a traveler’s dream, so dive in and make yourself at home! Safe travels, friend!</color>


